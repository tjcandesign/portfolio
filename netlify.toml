# Netlify deploy config
# On every push, Netlify runs the build command before publishing.
# This stamps today's date into the footer's "Last edited" line.

[build]
  command = "bash scripts/update-last-edited.sh"
  publish = "."

# AI Tools Assessment lives on Vercel; proxy it so the URL stays on this domain.
[[redirects]]
  from = "/aiassessment"
  to = "/aiassessment/"
  status = 301

[[redirects]]
  from = "/aiassessment/*"
  to = "https://ai-tools-assessment-virid.vercel.app/:splat"
  status = 200
  force = true
